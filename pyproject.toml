[project]
name = "pyclasher"
version = "1.0.1"
authors = [
    { name = "201st-Luka", email = "201stLuka@gmail.com" }
]
description = "PyClasher is the name of the asynchronous ClashOfClans API. It is an object-oriented wrapper client that provides easy access to the requested data."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: MIT License",
    "Operating System:: OS Independent"
]

[project.urls]
Homepage = "https://github.com/201st-Luka/PyClasher"
Issues = "https://github.com/201st-Luka/PyClasher/issues"

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
console_output_style = "count"
empty_parameter_set_mark = "fail_at_collect"
faulthandler_timeout = 30
junit_duration_report = "total"
junit_family = "xunit2"
junit_logging = "system-err"
minversion = "8.0"
plugins = ["pytest-asyncio>=0.23"]